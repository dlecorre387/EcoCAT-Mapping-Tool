name: Build EcoCAT Mapping Tool Image

# When to build new image
on:
  push:
    branches:
      - main
  workflow_dispatch:

# List jobs
jobs:

  # Only job is to build
  build:

    # OS
    runs-on: ubuntu-latest

    # Give it permissions
    permissions:
      contents: read
      packages: write

    # 
    steps:

      # Clone repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker build tool
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registry
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create image name (name) and tag (sha)
      - name: Resolve image name
        id: image
        run: |
          # GHCR rejects uppercase; owner names are not guaranteed lowercase.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER/ecocat" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Build and push to registry
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=sha-${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Logs
      - name: Report tag
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo ''
            echo "${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}"
            echo ''
            echo ""
            echo "Commit: \${{ github.sha }}\"
          } >> "$GITHUB_STEP_SUMMARY"